# Application secret used by the chart itself. PostgreSQL role password Secrets
# are separate CNPG basic-auth Secrets and are shown below.
apiVersion: v1
kind: Secret
metadata:
  name: powerdns-poweradmin-credentials
  namespace: dns-system
type: Opaque
stringData:
  pdns-api-key: "CHANGE_ME_LONG_RANDOM"
  poweradmin-admin-password: "CHANGE_ME_LONG_RANDOM"
  poweradmin-session-key: "CHANGE_ME_LONG_RANDOM"
---
apiVersion: v1
kind: Secret
metadata:
  name: powerdns-poweradmin-pdns-db
  namespace: dns-system
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: pdns
  password: "CHANGE_ME_LONG_RANDOM"
---
apiVersion: v1
kind: Secret
metadata:
  name: powerdns-poweradmin-poweradmin-db
  namespace: dns-system
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: poweradmin
  password: "CHANGE_ME_LONG_RANDOM"
