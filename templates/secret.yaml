{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerdns-poweradmin.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powerdns-poweradmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "powerdns-poweradmin.secretName" .) -}}
  {{- $g := .Values.secrets.generated }}
  {{- if $g.pdnsApiKey }}
  {{ .Values.secrets.keys.pdnsApiKey }}: {{ $g.pdnsApiKey | quote }}
  {{- else if $existing }}
  {{ .Values.secrets.keys.pdnsApiKey }}: {{ index $existing.data .Values.secrets.keys.pdnsApiKey | b64dec | quote }}
  {{- else }}
  {{ .Values.secrets.keys.pdnsApiKey }}: {{ randAlphaNum 64 | quote }}
  {{- end }}
  {{- if $g.poweradminAdminPassword }}
  {{ .Values.secrets.keys.poweradminAdminPassword }}: {{ $g.poweradminAdminPassword | quote }}
  {{- else if $existing }}
  {{ .Values.secrets.keys.poweradminAdminPassword }}: {{ index $existing.data .Values.secrets.keys.poweradminAdminPassword | b64dec | quote }}
  {{- else }}
  {{ .Values.secrets.keys.poweradminAdminPassword }}: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if $g.poweradminSessionKey }}
  {{ .Values.secrets.keys.poweradminSessionKey }}: {{ $g.poweradminSessionKey | quote }}
  {{- else if $existing }}
  {{ .Values.secrets.keys.poweradminSessionKey }}: {{ index $existing.data .Values.secrets.keys.poweradminSessionKey | b64dec | quote }}
  {{- else }}
  {{ .Values.secrets.keys.poweradminSessionKey }}: {{ randAlphaNum 64 | quote }}
  {{- end }}
{{- end }}
---
{{- $pdnsRoleName := include "powerdns-poweradmin.pdnsRoleSecretName" . }}
{{- if not .Values.postgresql.roles.pdns.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pdnsRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powerdns-poweradmin.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.roles.pdns.username | quote }}
  password: {{ include "powerdns-poweradmin.pdnsDbPassword" . | quote }}
{{- end }}
---
{{- $paRoleName := include "powerdns-poweradmin.poweradminRoleSecretName" . }}
{{- if not .Values.postgresql.roles.poweradmin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $paRoleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powerdns-poweradmin.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.roles.poweradmin.username | quote }}
  password: {{ include "powerdns-poweradmin.poweradminDbPassword" . | quote }}
{{- end }}
