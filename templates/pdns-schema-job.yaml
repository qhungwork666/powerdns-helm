{{- if .Values.postgresql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "powerdns-poweradmin.fullname" . }}-pdns-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powerdns-poweradmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdns-schema
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "powerdns-poweradmin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pdns-schema
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "powerdns-poweradmin.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: schema
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PGPASSWORD="$(cat /run/db/password)"
              until pg_isready -h "{{ include "powerdns-poweradmin.fullname" . }}-postgres-rw" -p 5432 -U pdns -d pdns; do sleep 2; done
              until psql "host={{ include "powerdns-poweradmin.fullname" . }}-postgres-rw port=5432 dbname=pdns user=pdns" -v ON_ERROR_STOP=1 -f /schema/pdns-schema.sql; do sleep 2; done
          volumeMounts:
            - name: db-credentials
              mountPath: /run/db
              readOnly: true
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: db-credentials
          secret:
            secretName: {{ include "powerdns-poweradmin.pdnsRoleSecretName" . }}
            items:
              - key: password
                path: password
        - name: schema
          configMap:
            name: {{ include "powerdns-poweradmin.fullname" . }}-pdns-schema
{{- end }}
