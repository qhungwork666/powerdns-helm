{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "powerdns-poweradmin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powerdns-poweradmin.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.existingGateway.name }}
      namespace: {{ .Values.gateway.existingGateway.namespace }}
      {{- with .Values.gateway.existingGateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "powerdns-poweradmin.fullname" . }}-poweradmin
          port: 80
{{- end }}
